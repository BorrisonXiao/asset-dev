# ############################################################################
# Model: SpeechLLM ASR with FIXED segmentation mean-pooling between the SSL
#        encoder and the LLM projection, trained end-to-end (proj + LoRA).
#        Baselines for the learned segmenter, and the frozen downstream
#        (reward model) that the segmenter's RL stage loads.
#
# boundary_source selects the segmentation:
#   fixed_rate : mean-pool every `fixed_rate_k` frames (no external data)
#   alignment  : mean-pool between externally provided boundaries — set
#                `boundary_target_dir` to a directory of per-utterance
#                `<id>.pt` files ({0,1} per encoder frame)
#   none       : original ConcatDownsampler behavior (use speechllm_e2e.yaml)
#
# Same objective and downstream as speechllm_e2e.yaml; only the sequence
# shortening differs (mean-pool keeps the feature dim, so proj takes
# ssl_feat_dims instead of ssl_feat_dims * downsampling_factor).
#
# based on speechllm_e2e.yaml by Adel Moumen, 2025
# ############################################################################

# Seed must be set at the top before objects with parameters are created
seed: 3407
__set_seed: !apply:speechbrain.utils.seed_everything [!ref <seed>]

####################### Experiment Configuration ###########################

experiment_name: speechllm_fixed_pooling
output_folder: !ref /saltpool0/scratch/rogertseng/speechllm/speechbrain/results/<experiment_name>/<boundary_source>/<seed>
output_wer_folder: !ref <output_folder>/wer_results
save_folder: !ref <output_folder>/save
train_log: !ref <output_folder>/train_log.txt
feats_cache_dir: null
ckpt_interval_minutes: 15

####################### Segmentation Configuration #########################

boundary_source: fixed_rate  # 'fixed_rate' | 'alignment'
# k=5 matches the 5x rate of the ConcatDownsampler in speechllm_e2e.yaml for
# an equal-compression comparison (the segmenter warmstart default is k=4).
fixed_rate_k: 5
boundary_target_dir: null    # required for boundary_source: alignment

####################### Data Configuration #################################

data_folder: /saltpool0/data/tseng/LibriSpeech  # PLACEHOLDER, e.g., /path/to/LibriSpeech
train_splits: ["train-clean-100", "train-clean-360", "train-other-500"]
dev_splits: ["dev-clean"]
test_splits: ["test-clean", "test-other", "dev-other"]
skip_prep: False
csv_folder: !ref <output_folder>
train_csv: !ref <csv_folder>/train.csv
valid_csv: !ref <csv_folder>/dev-clean.csv
test_csv:
    - !ref <csv_folder>/test-clean.csv
    - !ref <csv_folder>/test-other.csv
    - !ref <csv_folder>/dev-clean.csv
    - !ref <csv_folder>/dev-other.csv

####################### Model Paths & Configuration ########################

# SSL Model Configuration
ssl_hub: facebook/wav2vec2-base-960h
ssl_folder: !ref <save_folder>/ssl_checkpoint
ssl_frozen: True
ssl_device: cuda
ssl_output_norm: True
use_feats: False
# LLM Configuration
llm_path: google/gemma-3-1b-it # PLACEHOLDER
llm_emb_size: 1152
llm_save_path: !ref <save_folder>

####################### Training Hyperparameters ###########################

number_of_epochs: 1
batch_size: 32  # Only used if dynamic batching is off
grad_accumulation_factor: 5
sorting: random
num_workers: 0
precision: bf16  # Options: bf16, fp16, fp32
eval_precision: bf16
max_grad_norm: 1.0

####################### Learning Rate & Optimization ######################

initial_lr: 0.0005
final_lr: 0.00001
lr_ssl: 0.00002
weight_decay: 0.0

####################### Feature & Audio Parameters #########################

# Unused when boundary_source != none (feat_downsampler is Identity); the
# mean-pooling between boundaries does the sequence shortening.
downsampling_factor: 1

####################### Dynamic Batching Configuration ######################

# This setup works well for A100 80GB GPU; adapt to your needs
# Turn off dynamic batching if needed (training speed will decrease)
dynamic_batching: True
max_batch_length_train: 200
max_batch_length_val: 100  # Reduced for validation due to wider beam (VRAM)
num_bucket: 200
shuffle: True  # Re-creates batches at each epoch by shuffling examples
batch_ordering: random
max_batch_ex: 256

dynamic_batch_sampler_train:
    max_batch_length: !ref <max_batch_length_train>
    num_buckets: !ref <num_bucket>
    shuffle: !ref <shuffle>
    batch_ordering: !ref <batch_ordering>
    max_batch_ex: !ref <max_batch_ex>

dynamic_batch_sampler_valid:
    max_batch_length: !ref <max_batch_length_val>
    num_buckets: !ref <num_bucket>
    shuffle: !ref <shuffle>
    batch_ordering: !ref <batch_ordering>
    max_batch_ex: !ref <max_batch_ex>

####################### DataLoader Configuration ##########################
ignore_index: -100
test_batch_size: 1

# Dataloader options
train_dataloader_opts:
    batch_size: !ref <batch_size>
    shuffle: True
    num_workers: !ref <num_workers>
    collate_fn: !name:speechbrain.dataio.batch.PaddedBatch
        per_key_padding_kwargs:
            sig:
                value: 0
            tokens_eos:
                value: !ref <ignore_index>

valid_dataloader_opts:
    batch_size: !ref <test_batch_size>
    num_workers: 0
    collate_fn: !name:speechbrain.dataio.batch.PaddedBatch
        per_key_padding_kwargs:
            sig:
                value: 0
            tokens_eos:
                value: !ref <ignore_index>

test_dataloader_opts:
    batch_size: !ref <test_batch_size>
    num_workers: 0
    collate_fn: !name:speechbrain.dataio.batch.PaddedBatch
        per_key_padding_kwargs:
            sig:
                value: 0
            tokens_eos:
                value: !ref <ignore_index>

####################### Model Architecture Parameters #######################

# Output & Decoding Parameters
bos_index: 2 # 0
eos_index: 1 # 0
pad_token: 0 # 128256
prompt: "Transcribe speech to text."

####################### Model Components ####################################

normalize: !new:speechbrain.processing.features.InputNormalization
    norm_type: sentence

ssl: !new:speechbrain.integrations.huggingface.wav2vec2.Wav2Vec2
    source: !ref <ssl_hub>
    output_norm: !ref <ssl_output_norm>
    freeze: !ref <ssl_frozen>
    save_path: !ref <ssl_folder>
    device_map: !ref <ssl_device>
ssl_feat_dims: 768

activation: !name:torch.nn.ReLU
dnn_layers: 2
dnn_neurons: !ref <llm_emb_size>
# proj consumes mean-pooled features: same dim as the encoder output.
proj: !new:speechbrain.lobes.models.VanillaNN.VanillaNN
    input_shape: [null, null, !ref <ssl_feat_dims>]
    activation: !ref <activation>
    dnn_blocks: !ref <dnn_layers>
    dnn_neurons: !ref <dnn_neurons>


backbone_llm: !new:speechbrain.integrations.huggingface.llama.LLaMA
    source: !ref <llm_path>
    save_path: !ref <llm_save_path>
    freeze: True
    attn_implementation: sdpa
    device: cuda
    torch_dtype: !name:torch.bfloat16
    additional_special_tokens:
        - "<|start_of_audio|>"
        - "<|end_of_audio|>"
    output_hidden_states: False

lora_rank: 16
llm: !new:speechbrain.nnet.adapters.AdaptedModel
    model_to_adapt: !ref <backbone_llm>
    adapter_class: !name:speechbrain.nnet.adapters.LoRA
    all_linear: True
    adapter_kwargs:
        rank: !ref <lora_rank>

# Bypassed when boundary_source != none; kept for the none fallback.
feat_downsampler: !new:torch.nn.Identity

searcher: !new:speechbrain.decoders.seq2seq.S2SHuggingFaceLLMGreedySearcher
    llm_model: !ref <llm>
    temperature: 0.0
    min_decode_ratio: 0.0
    max_decode_ratio: 1.0
    bos_index: !ref <bos_index>
    eos_index: !ref <eos_index>

modules:
    ssl: !ref <ssl>
    feat_downsampler: !ref <feat_downsampler>
    llm: !ref <llm>
    proj: !ref <proj>
    normalize: !ref <normalize>
    searcher: !ref <searcher>

model: !new:torch.nn.ModuleList
    - [!ref <llm>, !ref <proj>]

####################### Optimizers & Schedulers ############################

opt: !name:torch.optim.AdamW
    lr: !ref <initial_lr>
    weight_decay: !ref <weight_decay>

opt_ssl: !name:torch.optim.AdamW
    lr: !ref <lr_ssl>
    weight_decay: !ref <weight_decay>

scheduler: !new:speechbrain.nnet.schedulers.LinearScheduler
    initial_value: !ref <initial_lr>
    final_value: !ref <final_lr>
    epoch_count: !ref <number_of_epochs>

lr_annealing_ssl: !new:speechbrain.nnet.schedulers.NewBobScheduler
    initial_value: !ref <lr_ssl>
    improvement_threshold: 0.0025
    annealing_factor: 0.8
    patient: 1

####################### Checkpointing & Logging #############################

checkpointer: !new:speechbrain.utils.checkpoints.Checkpointer
    checkpoints_dir: !ref <save_folder>
    recoverables:
        ssl: !ref <ssl>
        llm: !ref <llm>
        proj: !ref <proj>
        lr_annealing_ssl: !ref <lr_annealing_ssl>
        counter: !ref <epoch_counter>
        normalize: !ref <normalize>

epoch_counter: !new:speechbrain.utils.epoch_loop.EpochCounter
    limit: !ref <number_of_epochs>

train_logger: !new:speechbrain.utils.train_logger.FileTrainLogger
    save_file: !ref <train_log>

####################### Metrics #############################################

cer_computer: !name:speechbrain.utils.metric_stats.ErrorRateStats
    split_tokens: True

error_rate_computer: !name:speechbrain.utils.metric_stats.ErrorRateStats
